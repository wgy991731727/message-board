<!doctype html>
<html lang="zh-CN" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />
    <title>留言板 · 留下你的想法</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      };
    </script>
    <link rel="stylesheet" href="/style.css" />
    <script src="/script.js" defer></script>
  </head>
  <body class="min-h-full bg-slate-50 font-sans text-slate-900 antialiased transition-colors dark:bg-slate-950 dark:text-slate-100">
    <main class="mx-auto w-full max-w-3xl px-4 py-10 sm:px-6 sm:py-16">
      <header class="mb-8 flex items-center justify-between gap-4 sm:mb-10">
        <div>
          <p class="mb-2 text-sm font-semibold uppercase tracking-[0.2em] text-teal-700 dark:text-teal-300">
            留言 · 分享 · 交流
          </p>
          <h1 class="text-3xl font-bold tracking-tight sm:text-4xl">留言板</h1>
          <p class="mt-2 text-sm text-slate-600 dark:text-slate-400 sm:text-base">
            留下你的想法，和大家交流。
          </p>
        </div>
        <button
          id="theme-toggle"
          class="inline-flex shrink-0 items-center gap-2 rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-semibold text-slate-700 shadow-sm transition hover:border-teal-300 hover:text-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-500 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:hover:border-teal-500 dark:hover:text-teal-300"
          type="button"
          aria-label="切换到暗黑模式"
          aria-pressed="false"
        >
          <span id="theme-icon" aria-hidden="true">🌙</span>
          <span id="theme-label" class="hidden sm:inline">深色模式</span>
        </button>
      </header>

      <section class="mb-10 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-7 dark:border-slate-800 dark:bg-slate-900">
        <h2 class="text-lg font-semibold">写一条留言</h2>
        <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">友善交流，让每个想法都被看见。</p>

        <form id="message-form" class="mt-6 space-y-5">
          <div>
            <label for="nickname" class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">昵称</label>
            <input
              id="nickname"
              name="nickname"
              type="text"
              maxlength="30"
              placeholder="请输入昵称"
              autocomplete="nickname"
              required
              class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-teal-500 focus:bg-white focus:ring-4 focus:ring-teal-500/10 dark:border-slate-700 dark:bg-slate-950 dark:text-slate-100 dark:focus:border-teal-400 dark:focus:bg-slate-950"
            />
          </div>

          <div>
            <label for="content" class="mb-2 block text-sm font-medium text-slate-700 dark:text-slate-300">留言内容</label>
            <textarea
              id="content"
              name="content"
              rows="4"
              maxlength="1000"
              placeholder="写下你的留言（最多 1000 个字）"
              required
              class="w-full resize-y rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-teal-500 focus:bg-white focus:ring-4 focus:ring-teal-500/10 dark:border-slate-700 dark:bg-slate-950 dark:text-slate-100 dark:focus:border-teal-400 dark:focus:bg-slate-950"
            ></textarea>
          </div>

          <div class="flex flex-wrap items-center gap-4">
            <button
              id="submit-button"
              type="submit"
              class="inline-flex items-center justify-center rounded-xl bg-teal-700 px-5 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-teal-800 focus:outline-none focus:ring-4 focus:ring-teal-500/25 disabled:cursor-wait disabled:opacity-60 dark:bg-teal-500 dark:text-slate-950 dark:hover:bg-teal-400"
            >
              发布留言
            </button>
            <p id="status" class="min-h-6 text-sm text-emerald-700 dark:text-emerald-300" role="status" aria-live="polite"></p>
          </div>
        </form>
      </section>

      <section aria-labelledby="messages-heading">
        <div class="mb-4 flex items-end justify-between">
          <div>
            <p class="text-xs font-semibold uppercase tracking-[0.18em] text-slate-500 dark:text-slate-400">社区动态</p>
            <h2 id="messages-heading" class="mt-1 text-xl font-bold">所有留言</h2>
          </div>
        </div>
        <ul id="messages-list" class="space-y-4"></ul>
      </section>
    </main>
  </body>
</html>
